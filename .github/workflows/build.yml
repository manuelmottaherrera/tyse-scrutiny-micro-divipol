name: Divipol - Build Docker Image

on:
  # Solo se ejecuta cuando el CI Pipeline termina exitosamente
  workflow_run:
    workflows: ['Divipol - CI Pipeline']
    types: [completed]
    branches: [main, develop]
  # Tags se construyen directamente (releases)
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build Docker Image
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Solo construir si: CI pasó exitosamente O es un tag de release
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Para workflow_run, usar la referencia del workflow que lo disparó
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build production JAR
        run: |
          chmod +x mvnw
          ./mvnw -Pprod clean verify -DskipTests

      - name: Extract image tags
        id: meta
        run: |
          # Para workflow_run, usar la referencia del workflow que lo disparó
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=$BRANCH" >> $GITHUB_OUTPUT
            SHORT_SHA=$(echo $SHA | cut -c1-7)
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
            SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          fi

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image with Jib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.IMAGE_TAG }}
          SHORT_SHA=${{ steps.meta.outputs.SHORT_SHA }}

          # Build and push with Jib
          ./mvnw -Pprod verify jib:build \
            -Djib.to.image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -Djib.to.tags=${IMAGE_TAG}-${SHORT_SHA},latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -DskipTests

      - name: Image digest
        run: |
          echo "✅ Divipol Docker image built successfully"
          echo "📦 Registry: ${{ env.REGISTRY }}"
          echo "🏷️  Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.IMAGE_TAG }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.IMAGE_TAG }}, ${{ steps.meta.outputs.IMAGE_TAG }}-${{ steps.meta.outputs.SHORT_SHA }}, latest"

      - name: Notify Gateway for deployment
        if: steps.meta.outputs.BRANCH == 'develop'
        run: |
          echo "🚀 Divipol image ready for deployment"
          echo "To deploy, run the deployment workflow in the Gateway repository"
