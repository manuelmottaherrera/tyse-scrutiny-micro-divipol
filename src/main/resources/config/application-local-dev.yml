# ===================================================================
# Spring Boot configuration for the "local-dev" profile.
#
# Ejecuta la app localmente conectada al servidor de desarrollo (192.168.0.58).
#
# Uso: ./mvnw -Dspring-boot.run.profiles=local-dev
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.tyse.scrutiny: DEBUG

spring:
  cloud:
    consul:
      host: 192.168.0.58
      port: 8510
      config:
        fail-fast: true
        format: yaml
        profile-separator: '-'
      discovery:
        prefer-ip-address: true
    stream:
      kafka:
        binder:
          brokers: 192.168.0.58:9102
  r2dbc:
    url: r2dbc:postgresql://192.168.0.58:5433/tysescrutinymicrodivipol
    username: tysescrutinymicrodivipol
    password: ${DIVIPOL_DB_PASSWORD:}
  liquibase:
    url: jdbc:postgresql://192.168.0.58:5433/tysescrutinymicrodivipol
    user: tysescrutinymicrodivipol
    password: ${DIVIPOL_DB_PASSWORD:}
