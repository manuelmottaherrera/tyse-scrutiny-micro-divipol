    # =====================================================
    # Schemas de Jurados
    # =====================================================

    JuradoDTO:
      type: object
      description: Jurado de votación
      properties:
        id:
          type: integer
          format: int64
        tipoDocumento:
          type: string
          description: Tipo de documento (CC, CE, TI, etc.)
        numeroDocumento:
          type: string
          description: Número de documento
        nombres:
          type: string
        apellidos:
          type: string

    # =====================================================
    # Schemas de Testigos Electorales
    # =====================================================

    TestigoDTO:
      type: object
      description: Testigo electoral
      properties:
        id:
          type: integer
          format: int64
        tipoDocumento:
          type: string
          description: Tipo de documento (CC, CE, etc.)
        numeroDocumento:
          type: string
          description: Número de documento
        nombres:
          type: string
        apellidos:
          type: string
        telefono:
          type: string
        email:
          type: string
        activo:
          type: boolean
        puestosAsignados:
          type: integer
          description: Cantidad de puestos a los que está asignado

    TestigoCreateDTO:
      type: object
      description: Datos para crear un testigo electoral
      required:
        - tipoDocumento
        - numeroDocumento
        - nombres
        - apellidos
      properties:
        tipoDocumento:
          type: string
          maxLength: 10
        numeroDocumento:
          type: string
          maxLength: 20
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        telefono:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 100

    TestigoUpdateDTO:
      type: object
      description: Datos para actualizar un testigo electoral
      properties:
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        telefono:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 100

    TestigoAsignadoDTO:
      type: object
      description: Testigo asignado a un puesto
      properties:
        testigoId:
          type: integer
          format: int64
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        nombreCompleto:
          type: string
          description: Nombres y apellidos concatenados
        telefono:
          type: string
        assignedDate:
          type: string
          format: date-time
          description: Fecha de asignación
        assignedBy:
          type: string
          description: Usuario que realizó la asignación

    TestigoPage:
      type: object
      description: Página de testigos
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TestigoDTO'
        page:
          type: integer
          description: Número de página actual (0-indexed)
        size:
          type: integer
          description: Tamaño de página
        totalElements:
          type: integer
          format: int64
          description: Total de elementos
        totalPages:
          type: integer
          description: Total de páginas

