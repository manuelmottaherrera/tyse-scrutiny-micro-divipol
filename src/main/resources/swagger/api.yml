  /divipol/export/search/pdf:
    get:
      tags:
        - divipol-export
      summary: Exportar resultados de búsqueda a PDF
      description: |
        Genera un archivo PDF con los resultados de búsqueda.
        Si exportAll=true, exporta todos los resultados (máximo 10,000).
        Si exportAll=false, exporta solo la página actual.
      operationId: exportSearchToPdf
      parameters:
        - name: q
          in: query
          required: true
          description: Término de búsqueda
          schema:
            type: string
        - name: mode
          in: query
          required: false
          description: Modo de búsqueda
          schema:
            type: string
            enum: [name, code]
            default: name
        - name: page
          in: query
          required: false
          description: Número de página (usado si exportAll=false)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página (usado si exportAll=false)
          schema:
            type: integer
            default: 20
        - name: exportAll
          in: query
          required: false
          description: Si es true, exporta todos los resultados sin paginación
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Archivo PDF generado exitosamente
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  responses:
    Problem:
      description: error occurred - see status code and problem object for more information.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri
                description: |
                  An absolute URI that identifies the problem type.  When dereferenced,
                  it SHOULD provide human-readable documentation for the problem type
                  (e.g., using HTML).
                default: 'about:blank'
                example: 'https://www.jhipster.tech/problem/problem-with-message'
              title:
                type: string
                description: |
                  A short, summary of the problem type. Written in english and readable
                  for engineers (usually not suited for non technical stakeholders and
                  not localized); example: Service Unavailable
              status:
                type: integer
                format: int32
                description: |
                  The HTTP status code generated by the origin server for this occurrence
                  of the problem.
                minimum: 100
                maximum: 600
                exclusiveMaximum: true
                example: 503
              detail:
                type: string
                description: |
                  A human readable explanation specific to this occurrence of the
                  problem.
                example: Connection to database timed out
              instance:
                type: string
                format: uri
                description: |
                  An absolute URI that identifies the specific occurrence of the problem.
                  It may or may not yield further information if dereferenced.

  schemas:
    DivipolDepartamentoDTO:
      type: object
      properties:
        coddepto:
          type: integer
        nomdepto:
          type: string
        mujeres:
          type: integer
          format: int64
        hombres:
          type: integer
          format: int64
        totalPotencial:
          type: integer
          format: int64
        mesas:
          type: integer
          format: int64

    DivipolMunicipioDTO:
      type: object
      properties:
        coddepto:
          type: integer
        codmipio:
          type: integer
        nomdepto:
          type: string
        nommipio:
          type: string
        potencialFemenino:
          type: integer
          format: int64
        potencialMasculino:
          type: integer
          format: int64
        potencialTotal:
          type: integer
          format: int64
        mesas:
          type: integer
          format: int64

    DivipolZonaDTO:
      type: object
      properties:
        coddepto:
          type: integer
        codmipio:
          type: integer
        codzona:
          type: integer
        nomdepto:
          type: string
        nommipio:
          type: string
        potencialFemenino:
          type: integer
          format: int64
        potencialMasculino:
          type: integer
          format: int64
        potencialTotal:
          type: integer
          format: int64
        mesas:
          type: integer
          format: int64

    DivipolPuestoDTO:
      type: object
      properties:
        iddivipol:
          type: integer
          description: ID único del puesto
        coddepto:
          type: integer
        codmipio:
          type: integer
        codzona:
          type: integer
        codpuesto:
          type: string
        nomdepto:
          type: string
        nommipio:
          type: string
        nompuesto:
          type: string
        potencialFemenino:
          type: integer
          format: int64
        potencialMasculino:
          type: integer
          format: int64
        potencialTotal:
