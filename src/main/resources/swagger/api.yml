# API-first development with OpenAPI
# This file will be used at compile time to generate Spring-MVC endpoint stubs using openapi-generator
openapi: '3.0.1'
info:
  title: 'tyseScrutinyMicroDivipol'
  version: 0.0.1
servers:
  - url: http://localhost:8081/api
    description: Development server
  - url: https://localhost:8081/api
    description: Development server with TLS Profile
paths:
  /divipol/departamentos:
    get:
      tags:
        - divipol
      summary: Obtener todos los departamentos
      operationId: getAllDepartamentos
      responses:
        '200':
          description: Lista de departamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DivipolDepartamentoDTO'

  /divipol/municipios:
    get:
      tags:
        - divipol
      summary: Obtener municipios por departamento
      operationId: getMunicipiosByDepartamento
      parameters:
        - name: codDepto
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DivipolMunicipioDTO'

  /divipol/zonas:
    get:
      tags:
        - divipol
      summary: Obtener zonas por municipio
      operationId: getZonasByMunicipio
      parameters:
        - name: codDepto
          in: query
          required: true
          schema:
            type: integer
        - name: codMpio
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de zonas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DivipolZonaDTO'

  /divipol/puestos:
    get:
      tags:
        - divipol
      summary: Obtener puestos por zona
      operationId: getPuestosByZona
      parameters:
        - name: codDepto
          in: query
          required: true
          schema:
            type: integer
        - name: codMpio
          in: query
          required: true
          schema:
            type: integer
        - name: codZona
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de puestos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DivipolPuestoDTO'

  /divipol/stats:
    get:
      tags:
        - divipol
      summary: Obtener estadísticas generales
      operationId: getGeneralStats
      responses:
        '200':
          description: Estadísticas generales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivipolStatsDTO'

  /divipol/stats/departamento/{codDepto}:
    get:
      tags:
        - divipol
      summary: Obtener estadísticas de un departamento
      operationId: getStatsByDepartamento
      parameters:
        - name: codDepto
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estadísticas del departamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivipolStatsDTO'

  /divipol/stats/municipio/{codDepto}/{codMpio}:
    get:
      tags:
        - divipol
      summary: Obtener estadísticas de un municipio
      operationId: getStatsByMunicipio
      parameters:
        - name: codDepto
          in: path
          required: true
          schema:
            type: integer
        - name: codMpio
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estadísticas del municipio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivipolStatsDTO'

  /divipol/stats/zona/{codDepto}/{codMpio}/{codZona}:
    get:
      tags:
        - divipol
      summary: Obtener estadísticas de una zona
      operationId: getStatsByZona
      parameters:
        - name: codDepto
          in: path
          required: true
          schema:
            type: integer
        - name: codMpio
          in: path
          required: true
          schema:
            type: integer
        - name: codZona
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estadísticas de la zona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivipolStatsDTO'

  /divipol/search:
    get:
      tags:
        - divipol
      summary: Buscar registros de divipol
      description: |
        Busca registros de divipol por nombre (full-text search) o por código.
        - mode=name: Búsqueda full-text en español (nomdepto, nommipio, nompuesto)
        - mode=code: Búsqueda por prefijo del código divipol compuesto
      operationId: searchDivipol
      parameters:
        - name: q
          in: query
          required: true
          description: Término de búsqueda (mínimo 3 caracteres para modo name)
          schema:
            type: string
            minLength: 1
        - name: mode
          in: query
          required: false
          description: Modo de búsqueda
          schema:
            type: string
            enum: [name, code]
            default: name
        - name: page
          in: query
          required: false
          description: Número de página (0-indexed)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Resultados de búsqueda paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivipolSearchResultPage'
        '400':
          $ref: '#/components/responses/Problem'

  /divipol/search/suggestions:
    get:
      tags:
        - divipol
      summary: Obtener sugerencias de autocompletado
      description: Retorna hasta 5 sugerencias basadas en el término de búsqueda
      operationId: getSuggestions
      parameters:
        - name: q
          in: query
          required: true
          description: Término de búsqueda (mínimo 3 caracteres)
          schema:
            type: string
            minLength: 3
        - name: mode
          in: query
          required: false
          description: Modo de búsqueda
          schema:
            type: string
            enum: [name, code]
            default: name
      responses:
        '200':
          description: Lista de sugerencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DivipolSearchResultDTO'
                maxItems: 5

  # =====================================================
  # Endpoints de Exportación de Reportes
  # =====================================================

  /divipol/export/filters/csv:
    get:
      tags:
        - divipol-export
      summary: Exportar datos de filtros a CSV
      description: |
        Genera un archivo CSV con los datos del modo filtros.
        Incluye la tabla de datos según el nivel de filtro y las estadísticas.
      operationId: exportFiltersToCsv
      parameters:
        - name: codDepto
          in: query
          required: false
          description: Código del departamento
          schema:
            type: integer
        - name: codMpio
          in: query
          required: false
          description: Código del municipio
          schema:
            type: integer
        - name: codZona
          in: query
          required: false
          description: Código de la zona
          schema:
            type: integer
      responses:
        '200':
          description: Archivo CSV generado exitosamente
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /divipol/export/filters/pdf:
    get:
      tags:
        - divipol-export
      summary: Exportar datos de filtros a PDF
      description: |
        Genera un archivo PDF con los datos del modo filtros.
        Incluye la tabla de datos según el nivel de filtro y las estadísticas.
      operationId: exportFiltersToPdf
      parameters:
        - name: codDepto
          in: query
          required: false
          description: Código del departamento
          schema:
            type: integer
        - name: codMpio
          in: query
          required: false
          description: Código del municipio
          schema:
            type: integer
        - name: codZona
          in: query
          required: false
          description: Código de la zona
          schema:
            type: integer
      responses:
        '200':
          description: Archivo PDF generado exitosamente
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /divipol/export/search/csv:
    get:
      tags:
        - divipol-export
      summary: Exportar resultados de búsqueda a CSV
      description: |
        Genera un archivo CSV con los resultados de búsqueda.
        Si exportAll=true, exporta todos los resultados (máximo 10,000).
        Si exportAll=false, exporta solo la página actual.
      operationId: exportSearchToCsv
      parameters:
        - name: q
          in: query
          required: true
          description: Término de búsqueda
          schema:
            type: string
        - name: mode
          in: query
          required: false
          description: Modo de búsqueda
          schema:
            type: string
            enum: [name, code]
            default: name
        - name: page
          in: query
          required: false
          description: Número de página (usado si exportAll=false)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página (usado si exportAll=false)
          schema:
            type: integer
            default: 20
        - name: exportAll
          in: query
          required: false
          description: Si es true, exporta todos los resultados sin paginación
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Archivo CSV generado exitosamente
          content:
            text/csv:
              schema:
                type: string
                format: binary

  # =====================================================
  # Endpoints de Detalle de Puesto
  # =====================================================

  /divipol/puestos/{puestoId}/detalle:
    get:
      tags:
        - divipol-puesto
      summary: Obtener detalle completo de un puesto
      description: |
        Retorna información detallada del puesto incluyendo dirección,
        coordenadas geográficas, JAL, indicador, expandida y conteos
        de jurados y testigos asignados.
      operationId: getPuestoDetalle
      parameters:
        - name: puestoId
          in: path
          required: true
          description: ID del puesto (iddivipol)
          schema:
            type: integer
      responses:
        '200':
          description: Detalle del puesto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuestoDetalleDTO'
        '404':
          $ref: '#/components/responses/Problem'

  /divipol/puestos/{puestoId}/jurados:
    get:
      tags:
        - divipol-puesto
      summary: Obtener jurados de un puesto
      description: Lista los jurados de votación asignados al puesto (solo lectura)
      operationId: getJuradosByPuesto
      parameters:
        - name: puestoId
          in: path
          required: true
          description: ID del puesto (iddivipol)
          schema:
            type: integer
      responses:
        '200':
          description: Lista de jurados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JuradoDTO'

  /divipol/puestos/{puestoId}/testigos:
    get:
      tags:
        - divipol-puesto
      summary: Obtener testigos de un puesto
      description: Lista los testigos electorales asignados al puesto
      operationId: getTestigosByPuesto
      parameters:
        - name: puestoId
          in: path
          required: true
          description: ID del puesto (iddivipol)
          schema:
            type: integer
      responses:
        '200':
          description: Lista de testigos asignados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestigoAsignadoDTO'

  /divipol/puestos/{puestoId}/testigos/{testigoId}:
    post:
      tags:
        - divipol-puesto
      summary: Asignar testigo a puesto
      description: Asigna un testigo electoral a un puesto de votación
      operationId: asignarTestigoAPuesto
      parameters:
        - name: puestoId
          in: path
          required: true
          description: ID del puesto (iddivipol)
          schema:
            type: integer
        - name: testigoId
          in: path
          required: true
          description: ID del testigo
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Testigo asignado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestigoAsignadoDTO'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: El testigo ya está asignado a este puesto
          content:
            application/problem+json:
              schema:
                type: object
    delete:
      tags:
        - divipol-puesto
      summary: Desasignar testigo de puesto
      description: Elimina la asignación de un testigo electoral de un puesto
      operationId: desasignarTestigoDePuesto
      parameters:
        - name: puestoId
          in: path
          required: true
          description: ID del puesto (iddivipol)
          schema:
            type: integer
        - name: testigoId
          in: path
          required: true
          description: ID del testigo
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Testigo desasignado exitosamente
        '404':
          $ref: '#/components/responses/Problem'

  # =====================================================
  # Endpoints de Testigos Electorales
  # =====================================================

  /testigos:
    get:
      tags:
        - testigos
      summary: Listar todos los testigos
      description: Obtiene una lista paginada de testigos electorales activos
      operationId: getAllTestigos
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista paginada de testigos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestigoPage'
    post:
      tags:
        - testigos
      summary: Crear testigo
      description: Registra un nuevo testigo electoral
      operationId: createTestigo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestigoCreateDTO'
      responses:
        '201':
          description: Testigo creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestigoDTO'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: Ya existe un testigo con ese documento
          content:
            application/problem+json:
              schema:
                type: object

  /testigos/{id}:
    get:
      tags:
        - testigos
      summary: Obtener testigo por ID
      operationId: getTestigoById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Testigo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestigoDTO'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
        - testigos
      summary: Actualizar testigo
      operationId: updateTestigo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestigoUpdateDTO'
      responses:
        '200':
          description: Testigo actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestigoDTO'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - testigos
      summary: Eliminar testigo
      description: Desactiva un testigo electoral (soft delete)
      operationId: deleteTestigo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Testigo eliminado exitosamente
        '404':
          $ref: '#/components/responses/Problem'

  /testigos/search:
    get:
      tags:
        - testigos
      summary: Buscar testigos
      description: Busca testigos por nombre, apellido o número de documento
      operationId: searchTestigos
      parameters:
        - name: q
          in: query
          required: true
          description: Término de búsqueda (mínimo 2 caracteres)
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestigoPage'

  # =====================================================
  # Endpoints de Mesas de Votación
  # =====================================================

  /divipol/puestos/{puestoId}/mesas:
    get:
      tags:
        - divipol-puesto
      summary: Obtener mesas de un puesto
      description: Lista las mesas de votación activas del puesto
      operationId: getMesasByPuesto
      parameters:
        - name: puestoId
          in: path
          required: true
          description: ID del puesto (iddivipol)
          schema:
            type: integer
      responses:
        '200':
          description: Lista de mesas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesaVotacionDTO'
        '404':
          $ref: '#/components/responses/Problem'

  # =====================================================
  # Endpoints de Organizaciones Políticas
  # =====================================================

  /organizaciones:
    get:
      tags:
        - organizaciones
      summary: Listar organizaciones políticas
      description: Obtiene una lista paginada de organizaciones políticas activas
      operationId: getAllOrganizaciones
      parameters:
        - name: tipo
          in: query
          required: false
          description: Filtrar por tipo de organización
          schema:
            type: string
            enum: [PARTIDO, MOVIMIENTO, COALICION, GRUPO_SIGNIFICATIVO, COMITE_VOTO_BLANCO]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista paginada de organizaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizacionPoliticaPage'
    post:
      tags:
        - organizaciones
      summary: Crear organización política
      operationId: createOrganizacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizacionPoliticaCreateDTO'
      responses:
        '201':
          description: Organización creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizacionPoliticaDTO'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: Ya existe una organización con ese nombre
          content:
            application/problem+json:
              schema:
                type: object

  /organizaciones/{id}:
    get:
      tags:
        - organizaciones
      summary: Obtener organización por ID
      operationId: getOrganizacionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Organización encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizacionPoliticaDTO'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
        - organizaciones
      summary: Actualizar organización política
      operationId: updateOrganizacion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizacionPoliticaUpdateDTO'
      responses:
        '200':
          description: Organización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizacionPoliticaDTO'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - organizaciones
      summary: Eliminar organización (soft delete)
      operationId: deleteOrganizacion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Organización eliminada exitosamente
        '404':
          $ref: '#/components/responses/Problem'

  /organizaciones/search:
    get:
      tags:
        - organizaciones
      summary: Buscar organizaciones
      description: Busca organizaciones por nombre o sigla
      operationId: searchOrganizaciones
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizacionPoliticaPage'

  # =====================================================
  # Endpoints de Comisiones Escrutadoras
  # =====================================================

  /comisiones:
    get:
      tags:
        - comisiones
      summary: Listar comisiones escrutadoras
      description: Obtiene una lista paginada de comisiones escrutadoras activas
      operationId: getAllComisiones
      parameters:
        - name: tipo
          in: query
          required: false
          description: Filtrar por tipo de comisión
          schema:
            type: string
            enum: [AUXILIAR, MUNICIPAL, DISTRITAL, GENERAL]
        - name: departamentoId
          in: query
          required: false
          schema:
            type: integer
        - name: municipioId
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista paginada de comisiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComisionEscrutadoraPage'
    post:
      tags:
        - comisiones
      summary: Crear comisión escrutadora
      operationId: createComision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComisionEscrutadoraCreateDTO'
      responses:
        '201':
          description: Comisión creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComisionEscrutadoraDTO'
        '400':
          $ref: '#/components/responses/Problem'

  /comisiones/{id}:
    get:
      tags:
        - comisiones
      summary: Obtener comisión por ID
      operationId: getComisionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
