# Configuración de Cucumber
# Ver: https://cucumber.io/docs/cucumber/configuration/

# Mostrar colores en la consola
cucumber.ansi-colors.disabled=false

# Mostrar snippets de steps no implementados
cucumber.publish.quiet=true

# Configuración de plugins (esto también está en CucumberIT.java)
# cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html

# Filtrar por tags - Excluir tests marcados como @wip (work in progress)
# Los tests @wip tienen problemas conocidos que se están investigando
cucumber.filter.tags=not @wip

# Glue (ubicación de step definitions)
cucumber.glue=com.tyse.scrutiny.micro.divipol.cucumber.stepdefs

# Features (ubicación de archivos .feature)
cucumber.features=classpath:features

# Opciones de snippets
cucumber.snippet-type=camelcase

# Mostrar stack traces completos en errores
cucumber.execution.strict=true

# Orden de ejecución
cucumber.execution.order=random
